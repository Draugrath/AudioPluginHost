# Audio Plugin Host settings. The in-game Save button rewrites this file.

# Turns all plugins on or off.
bEnabled = true

# Keeps plugin windows above the game.
bEditorsOnTop = true

# For stereo speakers or headphones: the plugins process the final stereo mix instead of the game's 6 channels.
bStereoMaster = false

# Key that opens the menu, as a Windows key code (117 = F6).
iToggleKey = 117

# Size of the window: 0.75, 1, 1.25, 1.5, 1.75, 2, 2.5 or 3 (2 suits 4K screens).
fWindowScale = 1

# Another folder to search for .vst3 plugins, besides C:\Program Files\Common Files\VST3 and SKSE\Plugins\AudioPluginHost\VST3.
sExtraFolder =

# Each slot in processing order: on (0 or 1), the plugin's class ID, its file. The plugin's own settings are in AudioPluginHost\SlotN.state.
